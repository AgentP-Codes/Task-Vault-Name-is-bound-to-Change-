[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "taskvault"
version = "0.4.2"
description = "A task-scoped data vault for AI agents: contain prompt injection by limiting what a hijacked agent can reach and where data can go."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "AgentP-Codes"}]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "cryptography>=49"]
keywords = ["ai-agents", "prompt-injection", "llm-security", "mcp", "data-vault", "pseudonymization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "psycopg[binary]>=3.1", "hypothesis>=6"]
aws = ["boto3>=1.34"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
all = ["anthropic>=0.40", "openai>=1.40", "google-genai>=1.0", "boto3>=1.34", "psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/AgentP-Codes/Task-Vault-Name-is-bound-to-Change-"
Issues = "https://github.com/AgentP-Codes/Task-Vault-Name-is-bound-to-Change-/issues"

[project.scripts]
taskvault = "taskvault.cli:main"

[tool.setuptools]
packages = ["taskvault", "taskvault.connectors", "taskvault.templates"]

[tool.setuptools.package-data]
"taskvault" = ["py.typed"]
"taskvault.templates" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "E741", "B023", "UP007", "UP045"]
